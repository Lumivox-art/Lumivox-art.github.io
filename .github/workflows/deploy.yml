name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ./MoM-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./MoM-web

      - name: Build for GitHub Pages
        run: npm run build:gh-pages
        working-directory: ./MoM-web
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}

      # Pages is sourced from the main branch root, so mirror the built dist there.
      - name: Publish built site to repository root
        run: |
          rm -rf mom-static lumivox-media
          cp -r MoM-web/dist/* .

      - name: Commit and push site snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f index.html 404.html .nojekyll mom-static lumivox-media
          if git diff --staged --quiet; then
            echo "No site changes to publish."
            exit 0
          fi
          git commit -m "deploy: publish GitHub Pages build [skip ci]"
          git push
